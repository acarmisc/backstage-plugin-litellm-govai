name: Publish to npm

# Release process:
#   git tag litellm@X.Y.Z          # or litellm-backend@X.Y.Z
#   git push origin litellm@X.Y.Z
#
# The tag prefix selects which workspace package gets published, and its
# version must match the version already committed in that package's
# package.json.

on:
  push:
    tags:
      - "litellm@*"
      - "litellm-backend@*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            litellm-backend@*)
              echo "dir=packages/plugin-litellm-backend" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#litellm-backend@}" >> "$GITHUB_OUTPUT"
              ;;
            litellm@*)
              echo "dir=packages/plugin-litellm" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#litellm@}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unrecognized tag pattern: $TAG"
              exit 1
              ;;
          esac

      - name: Verify tag version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          TAG_VERSION="${{ steps.pkg.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match ${{ steps.pkg.outputs.dir }}/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.pkg.outputs.dir }}
        # Backstage's MUI4 theme has a react@^17 peer dep; --legacy-peer-deps
        # mirrors local install behaviour and avoids npm@7+ ERESOLVE failures.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm run build

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true